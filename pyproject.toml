[project]
name = "coding-agent"
version = "0.1.0"
description = "ローカルで動く軽量・シンプルなコーディングエージェント"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
]

[project.scripts]
agent = "agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
